name: saldo-envias-usdt-telegram

on:
  workflow_dispatch:
  # Si querés habilitar también el scheduler interno de GitHub:
  # schedule:
  #   - cron: "3-59/10 * * * *"

concurrency:
  group: saldo-envias-usdt-telegram
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Evita el warning de Node 20 y fuerza runtime moderno
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      LIMIT: "93"
      MOVE_THRESHOLD: "0.1"

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run monitor and extract value
        id: monitor
        run: |
          OUT="$(python monitor.py)"
          echo "$OUT"

          VAL="$(echo "$OUT" | sed -n 's/^ENVIAS_USDT=//p' | tail -n 1)"
          echo "VAL=$VAL"

          if [ -z "$VAL" ]; then
            echo "No pude extraer ENVIAS_USDT del output."
            exit 1
          fi

          echo "value=$VAL" >> "$GITHUB_OUTPUT"

      - name: Write Google credentials
        run: |
          echo "${{ secrets.GSERVICE_JSON_B64 }}" | base64 -d > gservice.json

      - name: Append to Google Sheets
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          VALUE_USDT: ${{ steps.monitor.outputs.value }}
          GOOGLE_APPLICATION_CREDENTIALS: gservice.json
          GSHEET_TAB: "Historial_usdt_ppal"
        run: |
          python append_to_sheets.py

      - name: Alert rules (Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LIMIT: ${{ env.LIMIT }}
          MOVE_THRESHOLD: ${{ env.MOVE_THRESHOLD }}
        run: |

          CUR="${{ steps.monitor.outputs.value }}"
          TS="$(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M:%S')"

          echo "CUR=$CUR  TS=$TS  LIMIT=$LIMIT  MOVE_THRESHOLD=$MOVE_THRESHOLD"

          # 1) Solo seguimos si CUR < LIMIT
          export CUR LIMIT
          BELOW="$(python -c "import os; cur=float(os.environ['CUR']); lim=float(os.environ['LIMIT']); print('yes' if cur < lim else 'no')")"
          echo "BELOW=$BELOW"

          if [ "$BELOW" != "yes" ]; then
            echo "No alert: CUR >= LIMIT"
            exit 0
          fi

          # 2) Baseline = último valor enviado
          if [ -f last_alert_value.txt ]; then
            BASE="$(cat last_alert_value.txt | tr -d ' \n\r')"
          else
            BASE=""
          fi

          echo "BASE=$BASE"

          export CUR
          RENTPOT_PCT="$(python -c "import os; v=float(os.environ['CUR']); r=((9000*0.954*0.985 - 1)/(v*90)) - 1; print(f'{r*100:.2f}%')")"
          echo "RENTPOT_PCT=$RENTPOT_PCT"

          # Primer alerta si nunca hubo baseline
          if [ -z "$BASE" ]; then
            echo "$CUR" > last_alert_value.txt

            MSG=$'🟡 ENVIAS_USDT bajo '"$LIMIT"$'\n('"$TS"$')\nActual: '"$CUR"$'\nBaseline fijado'

            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" >/dev/null

            exit 0
          fi

          # 3) Movimiento acumulado
          export BASE CUR
          DIFF="$(python -c "import os; base=float(os.environ['BASE']); cur=float(os.environ['CUR']); print(abs(cur-base))")"
          echo "DIFF=$DIFF"

          export DIFF MOVE_THRESHOLD
          SHOULD="$(python -c "import os; diff=float(os.environ['DIFF']); thr=float(os.environ['MOVE_THRESHOLD']); print('yes' if diff >= thr else 'no')")"
          echo "SHOULD=$SHOULD"

          if [ "$SHOULD" = "yes" ]; then

            export BASE CUR
            DELTA="$(python -c "import os; b=float(os.environ['BASE']); c=float(os.environ['CUR']); print(c-b)")"
            DIR="$(python -c "import os; b=float(os.environ['BASE']); c=float(os.environ['CUR']); print('down' if c < b else ('up' if c > b else 'flat'))")"

            if [ "$DIR" = "down" ]; then
              ICON="🟢"
            elif [ "$DIR" = "up" ]; then
              ICON="🔴"
            else
              ICON="⚪️"
            fi

            MSG="$(printf "%s ENVIAS_USDT\n(%s)\nAnterior: %s\nActual: %s\nRend.Pot.: %s" \
            "$ICON" "$TS" "$BASE" "$CUR" "$RENTPOT_PCT")"

            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" >/dev/null

            echo "$CUR" > last_alert_value.txt
          else
            echo "No alert: movement < threshold (acumula hasta llegar a $MOVE_THRESHOLD)"
          fi

      - name: Commit baseline file (only if changed)
        run: |

          if [ ! -f last_alert_value.txt ]; then
            echo "No baseline file yet."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add last_alert_value.txt

          git diff --cached --quiet && exit 0

          git commit -m "Update last_alert_value baseline"
          git push
